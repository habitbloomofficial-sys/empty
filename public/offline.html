<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JARVIS is not running</title>
    <style>
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #eaf4fd; color: #0f2942;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center; padding: 2rem;
      }
      .orb {
        width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 1.5rem;
        background: radial-gradient(circle at 50% 45%, #cfeaff, #2f7fc4 60%, #123a5e);
        opacity: 0.45;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0.35rem 0; opacity: 0.75; font-size: 0.9rem; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div>
      <div class="orb"></div>
      <h1>JARVIS isn't running</h1>
      <p>Start him on your computer — double-click <b>START-JARVIS.bat</b> — then reopen this.</p>
      <p>If you're on your phone, your computer and phone have to be on the same Wi-Fi.</p>
    </div>
  </body>
</html>
